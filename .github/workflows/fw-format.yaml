# =============================================================================
# Workflow: Code Style Check (AStyle)
# =============================================================================
#
# Trigger:
#   - workflow_dispatch: Manual trigger via GitHub UI
#   - pull_request: On open, synchronize, or reopen targeting any branch
#   - push to branches 'main', 'master', or 'dev'
#   Pull requests and pushes only when C/C++ sources, the scripts or this file change
#
# Function:
#   Checks the code style of the repository using AStyle. AStyle is built from
#   source and the repository's 'scripts/bash/check-format.sh' script is executed in
#   dry-run mode to report style violations without modifying any files.
#
# Variables:
#   source_dirs         - Directories with the C/C++ sources, separated by spaces
#                         (set by the init script for the selected project type)
#
# Secrets:
#   (none)
# =============================================================================

name: Firmware / Code Style Check

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.c'
      - '**.h'
      - '**.cpp'
      - '**.hpp'
      - 'scripts/**'
      - '.github/workflows/fw-format.yaml'
  push:
    branches:
      - main
      - master
      - dev
    paths:
      - '**.c'
      - '**.h'
      - '**.cpp'
      - '**.hpp'
      - 'scripts/**'
      - '.github/workflows/fw-format.yaml'

env:
  # Directories with the C/C++ sources
  source_dirs: firmware

permissions:
  contents: read
  pull-requests: write

jobs:
  astyle-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AStyle
        run: |
          sudo apt-get update
          sudo apt-get install -y lbzip2 build-essential cmake pkg-config
          wget https://sourceforge.net/projects/astyle/files/astyle/astyle%203.6/astyle-3.6.13.tar.bz2/download -O astyle.tar.bz2
          tar -xf astyle.tar.bz2
          cd astyle-3.6.13/
          mkdir -p build
          cd build
          cmake ../
          make
          sudo make install

      - name: Check code style
        run: |
          chmod +x ./scripts/bash/check-format.sh
          ./scripts/bash/check-format.sh ${{ env.source_dirs }}
