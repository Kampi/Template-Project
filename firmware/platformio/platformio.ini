; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

; Target build. The platform version defines the ESP-IDF version:
; espressif32 7.1.x contains ESP-IDF v6.1
[env:esp32dev]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Static code analysis (pio check)
check_tool = cppcheck
check_skip_packages = yes
check_flags =
    cppcheck: --inline-suppr

; Unit tests run on the host only (pio test -e native)
test_ignore = *

; Unit tests of the hardware independent code in lib/ on the host
[env:native]
platform = native
test_framework = unity
